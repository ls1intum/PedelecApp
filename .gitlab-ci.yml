default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
 
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
 
stages:
  - build
 
build:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/$GO_MODULE:$CI_COMMIT_REF_SLUG
  before_script:
    - cd Pedelec\ Server/$GO_MODULE
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE/$GO_MODULE:latest"
        docker push "$CI_REGISTRY_IMAGE/$GO_MODULE:latest"
      fi

  parallel:
    matrix:
      - GO_MODULE: [reservation, location, damage]
  tags:
    - docker