default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
 
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
 
stages:
  - build
 
build:
  stage: build
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/$GO_MODULE:$CI_COMMIT_REF_SLUG
  script:
    - cd Pedelec\ Server/$GO_MODULE
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  parallel:
    matrix:
      - GO_MODULE: [reservation, location, damage]
  tags:
    - docker