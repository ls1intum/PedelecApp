apiVersion: apps/v1
kind: Deployment
metadata:
    name: location
    namespace: pedelec
spec:
    replicas: 1
    selector:
        matchLabels:
            app: location
    template:
        metadata:
            labels:
                app: location
        spec:
            containers:
            - name: location
              image: gitlab.lrz.de:5005/ase/ipraktikum/pedelec-app/location:feat-add-microservices
              ports:
              - containerPort: 8081
                name: location-api
        
              resources: # It is always a good idea to limit the resources of your containers - We did not cover this in the lecture, but it is a good practice to do so.
                limits:
                    cpu: "1"
                    memory: "512Mi"